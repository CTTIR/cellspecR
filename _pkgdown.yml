url: https://cttir.github.io/cellspecR/

template:
  includes:
    in_header: |
      <meta name="theme-color" content="#1565c0">
      <script defer data-domain="cttir.github.io/cellspecr" src="https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"></script>
  package: themakR

development:
  mode: auto

home:
  title: cellspecR
  description: Specification, readers and validation for multiplexed imaging cell tables.

reference:
  - title: Specification
    desc: Version, columns and controlled vocabularies of the cellspec format.
    contents:
      - cs_spec_version
      - cs_vocabulary

  - title: Object
    desc: Build a cellspec object and access its components, features and markers.
    contents:
      - cs_new
      - cs_accessors
      - cs_features
      - cs_markers
      - is_cellspec

  - title: Validation
    desc: Check an object against the specification and summarise signal support.
    contents:
      - cs_validate
      - cs_feature_support

  - title: Readers and storage
    desc: Read tool exports, combine objects, and write, read and verify cellspec directories.
    contents:
      - cs_formats
      - cs_detect_format
      - cs_column_map
      - cs_read
      - cs_read_cellspec
      - cs_verify
      - cs_write
      - cs_bind
      - cs_merge_tiles
      - cs_read_npy

  - title: Signals
    desc: Select one signal per marker through an explicit policy and map marker names.
    contents:
      - cs_signal_policy
      - cs_signal_matrix
      - cs_marker_map
      - cs_read_signal_policy
      - cs_write_signal_policy

  - title: Interoperability and app
    desc: Convert to and from SpatialExperiment and AnnData, and review exports in a local app.
    contents:
      - cs_as_spe
      - cs_from_spe
      - cs_as_anndata
      - cs_app

  - title: Methods
    desc: Print, summarise, subset, convert and plot cellspec objects.
    contents:
      - cellspec-methods
      - as.data.frame.cellspec
      - "[.cellspec"
      - plot.cellspec

  - title: Examples
    desc: A small synthetic object for examples and tests.
    contents:
      - cs_example

  - title: Package
    desc: Package overview.
    contents:
      - cellspecR-package

articles:
  - title: Get started
    navbar: ~
    contents:
      - cellspecR
      - reading-exports
      - interoperability

  - title: Reference
    desc: The format and the reader grammars in detail.
    navbar: Reference
    contents:
      - specification
      - adapters-reference

  - title: Performance
    desc: Timings recorded for the readers and the storage functions.
    contents:
      - articles/performance
