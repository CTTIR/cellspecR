<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgcell" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"  stop-color="#04120e"/>
      <stop offset="100%" stop-color="#020a08"/>
    </linearGradient>
    <clipPath id="hexcell">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgcell)"/>

  <g clip-path="url(#hexcell)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- CENTROID SCATTER — faint tissue hint behind the table   -->
    <!-- ══════════════════════════════════════════════════════ -->
    <g opacity="0.5">
      <circle cx="120" cy="200" r="2"   fill="#1D9E75" opacity="0.3"/>
      <circle cx="160" cy="175" r="1.6" fill="#1D9E75" opacity="0.25"/>
      <circle cx="360" cy="185" r="2"   fill="#1D9E75" opacity="0.3"/>
      <circle cx="400" cy="215" r="1.6" fill="#1D9E75" opacity="0.22"/>
      <circle cx="110" cy="320" r="1.8" fill="#1D9E75" opacity="0.28"/>
      <circle cx="150" cy="360" r="2"   fill="#1D9E75" opacity="0.3"/>
      <circle cx="380" cy="345" r="1.8" fill="#1D9E75" opacity="0.26"/>
      <circle cx="410" cy="315" r="1.6" fill="#1D9E75" opacity="0.24"/>
      <circle cx="250" cy="410" r="2"   fill="#1D9E75" opacity="0.28"/>
      <circle cx="300" cy="400" r="1.6" fill="#1D9E75" opacity="0.22"/>
      <circle cx="200" cy="405" r="1.6" fill="#1D9E75" opacity="0.24"/>
      <circle cx="330" cy="160" r="1.5" fill="#1D9E75" opacity="0.2"/>
      <circle cx="90"  cy="255" r="1.5" fill="#1D9E75" opacity="0.22"/>
      <circle cx="420" cy="270" r="1.5" fill="#1D9E75" opacity="0.2"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FILE TABS — three thin format tabs, top-left            -->
    <!-- .tsv / .csv / .txt feeding arrows into the table        -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- tab 1 .tsv -->
    <g transform="translate(78,158)">
      <path d="M 0,0 L 44,0 L 44,26 L 0,26 Z" fill="#08382C" stroke="#1D9E75" stroke-width="1.2" opacity="0.92"/>
      <path d="M 0,0 L 12,0 L 12,-5 L 32,-5 L 32,0 L 44,0" fill="#0a4436" stroke="#1D9E75" stroke-width="1" opacity="0.9"/>
      <text font-family="monospace" font-size="8" font-weight="700" fill="#80CBC4" text-anchor="middle" x="22" y="17">.tsv</text>
    </g>
    <!-- tab 2 .csv -->
    <g transform="translate(90,190)">
      <path d="M 0,0 L 44,0 L 44,26 L 0,26 Z" fill="#08382C" stroke="#1D9E75" stroke-width="1.2" opacity="0.92"/>
      <path d="M 0,0 L 12,0 L 12,-5 L 32,-5 L 32,0 L 44,0" fill="#0a4436" stroke="#1D9E75" stroke-width="1" opacity="0.9"/>
      <text font-family="monospace" font-size="8" font-weight="700" fill="#80CBC4" text-anchor="middle" x="22" y="17">.csv</text>
    </g>
    <!-- tab 3 .txt -->
    <g transform="translate(78,222)">
      <path d="M 0,0 L 44,0 L 44,26 L 0,26 Z" fill="#08382C" stroke="#1D9E75" stroke-width="1.2" opacity="0.92"/>
      <path d="M 0,0 L 12,0 L 12,-5 L 32,-5 L 32,0 L 44,0" fill="#0a4436" stroke="#1D9E75" stroke-width="1" opacity="0.9"/>
      <text font-family="monospace" font-size="8" font-weight="700" fill="#80CBC4" text-anchor="middle" x="22" y="17">.txt</text>
    </g>

    <!-- feed arrows into the table -->
    <path d="M 122,171 Q 150,178 162,196" fill="none" stroke="#1D9E75" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/>
    <polygon points="157,190 164,199 154,198" fill="#1D9E75" opacity="0.6"/>
    <path d="M 134,203 Q 150,206 160,210" fill="none" stroke="#1D9E75" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/>
    <polygon points="155,205 163,211 153,214" fill="#1D9E75" opacity="0.6"/>
    <path d="M 122,235 Q 150,232 162,224" fill="none" stroke="#1D9E75" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/>
    <polygon points="157,229 164,222 154,221" fill="#1D9E75" opacity="0.6"/>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- TIDY TABLE GRID — 6 columns × 8 rows                    -->
    <!-- Centre, drawn like qviewparsR's plate                   -->
    <!-- x: 172..392 (220 wide, 6 cols → 36.7 each)              -->
    <!-- y: 196..356 (160 tall, header + 7 rows → 20 each)       -->
    <!-- ══════════════════════════════════════════════════════ -->

    <!-- table背景 -->
    <rect x="172" y="196" width="220" height="160" rx="3" fill="#061c16" stroke="#1D9E75" stroke-width="1.8" opacity="0.95"/>

    <!-- header row band -->
    <rect x="172" y="196" width="220" height="20" rx="3" fill="#0a4436" opacity="0.85"/>
    <rect x="172" y="212" width="220" height="4" fill="#0a4436" opacity="0.85"/>

    <!-- column separators -->
    <line x1="208.7" y1="196" x2="208.7" y2="356" stroke="#12503C" stroke-width="0.7" opacity="0.6"/>
    <line x1="245.3" y1="196" x2="245.3" y2="356" stroke="#12503C" stroke-width="0.7" opacity="0.6"/>
    <line x1="282.0" y1="196" x2="282.0" y2="356" stroke="#12503C" stroke-width="0.7" opacity="0.6"/>
    <line x1="318.7" y1="196" x2="318.7" y2="356" stroke="#12503C" stroke-width="0.7" opacity="0.6"/>
    <line x1="355.3" y1="196" x2="355.3" y2="356" stroke="#12503C" stroke-width="0.7" opacity="0.6"/>

    <!-- row separators -->
    <line x1="172" y1="236" x2="392" y2="236" stroke="#12503C" stroke-width="0.6" opacity="0.5"/>
    <line x1="172" y1="256" x2="392" y2="256" stroke="#12503C" stroke-width="0.6" opacity="0.5"/>
    <line x1="172" y1="276" x2="392" y2="276" stroke="#12503C" stroke-width="0.6" opacity="0.5"/>
    <line x1="172" y1="296" x2="392" y2="296" stroke="#12503C" stroke-width="0.6" opacity="0.5"/>
    <line x1="172" y1="316" x2="392" y2="316" stroke="#12503C" stroke-width="0.6" opacity="0.5"/>
    <line x1="172" y1="336" x2="392" y2="336" stroke="#12503C" stroke-width="0.6" opacity="0.5"/>

    <!-- header labels (tiny monospace) — split across the 6 cols -->
    <text font-family="monospace" font-size="5.4" fill="#5a7a9a" text-anchor="middle" x="190" y="209">cell_id</text>
    <text font-family="monospace" font-size="5.4" fill="#5a7a9a" text-anchor="middle" x="227" y="209">x</text>
    <text font-family="monospace" font-size="5.4" fill="#5a7a9a" text-anchor="middle" x="263" y="209">y</text>
    <text font-family="monospace" font-size="4.6" fill="#5a7a9a" text-anchor="middle" x="300" y="206">nucleus:</text>
    <text font-family="monospace" font-size="4.6" fill="#5a7a9a" text-anchor="middle" x="300" y="212">FOXP3</text>
    <text font-family="monospace" font-size="5.4" fill="#5a7a9a" text-anchor="middle" x="337" y="209">:mean</text>
    <text font-family="monospace" font-size="5.4" fill="#3a9d72" text-anchor="middle" x="373" y="209">call</text>

    <!-- data cell content hints — dim dashes for values -->
    <g stroke="#3a4a6a" stroke-width="1.1" opacity="0.55" stroke-linecap="round">
      <!-- cell_id column (col1 centre 190) -->
      <line x1="181" y1="226" x2="199" y2="226"/><line x1="181" y1="246" x2="199" y2="246"/>
      <line x1="181" y1="266" x2="199" y2="266"/><line x1="181" y1="286" x2="199" y2="286"/>
      <line x1="181" y1="306" x2="199" y2="306"/><line x1="181" y1="326" x2="199" y2="326"/>
      <line x1="181" y1="346" x2="199" y2="346"/>
      <!-- x column (227) -->
      <line x1="220" y1="226" x2="234" y2="226"/><line x1="220" y1="246" x2="234" y2="246"/>
      <line x1="220" y1="266" x2="234" y2="266"/><line x1="220" y1="286" x2="234" y2="286"/>
      <line x1="220" y1="306" x2="234" y2="306"/><line x1="220" y1="326" x2="234" y2="326"/>
      <line x1="220" y1="346" x2="234" y2="346"/>
      <!-- y column (263) -->
      <line x1="256" y1="226" x2="270" y2="226"/><line x1="256" y1="246" x2="270" y2="246"/>
      <line x1="256" y1="266" x2="270" y2="266"/><line x1="256" y1="286" x2="270" y2="286"/>
      <line x1="256" y1="306" x2="270" y2="306"/><line x1="256" y1="326" x2="270" y2="326"/>
      <line x1="256" y1="346" x2="270" y2="346"/>
    </g>

    <!-- VIRIDIS strip in the marker-value column (col5, centre 337) -->
    <rect x="322" y="219" width="30" height="15" rx="1" fill="#440154" opacity="0.9"/>
    <rect x="322" y="239" width="30" height="15" rx="1" fill="#3b528b" opacity="0.9"/>
    <rect x="322" y="259" width="30" height="15" rx="1" fill="#21908c" opacity="0.9"/>
    <rect x="322" y="279" width="30" height="15" rx="1" fill="#5dc863" opacity="0.9"/>
    <rect x="322" y="299" width="30" height="15" rx="1" fill="#addc30" opacity="0.9"/>
    <rect x="322" y="319" width="30" height="15" rx="1" fill="#fde725" opacity="0.9"/>
    <rect x="322" y="339" width="30" height="12" rx="1" fill="#21908c" opacity="0.9"/>

    <!-- call column (col6, centre 373) — pos/neg dots -->
    <circle cx="373" cy="226" r="2.5" fill="#fde725" opacity="0.9"/>
    <circle cx="373" cy="246" r="2.5" fill="#3a4a6a" opacity="0.8"/>
    <circle cx="373" cy="266" r="2.5" fill="#fde725" opacity="0.9"/>
    <circle cx="373" cy="286" r="2.5" fill="#fde725" opacity="0.9"/>
    <circle cx="373" cy="306" r="2.5" fill="#3a4a6a" opacity="0.8"/>
    <circle cx="373" cy="326" r="2.5" fill="#fde725" opacity="0.9"/>
    <circle cx="373" cy="346" r="2.5" fill="#3a4a6a" opacity="0.8"/>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- CHECK-MARK SEAL — lower-right edge of the table          -->
    <!-- ══════════════════════════════════════════════════════ -->
    <g transform="translate(392,356)">
      <circle cx="0" cy="0" r="14" fill="#08382C" stroke="#1D9E75" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#1D9E75" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.6" transform="scale(1.28)"/>
      <path d="M -6,0 L -1.5,5 L 7,-6" fill="none" stroke="#80CBC4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- HASH STRING under the grid                              -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text font-family="monospace" font-size="8" fill="#2a4a44" opacity="0.75"
      text-anchor="middle" x="250" y="378">sha256 3fa1…c7e9</text>

    <!-- tidy-table label -->
    <text font-family="monospace" font-size="7" fill="#1D9E75" opacity="0.55"
      text-anchor="middle" x="250" y="420">one tidy table</text>

  </g>

  <!-- Hex border — parser teal -->
  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"
    fill="none" stroke="#0F6E56" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="250,44 441,153 441,367 250,476 59,367 59,153"
    fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linejoin="round" opacity="0.55"/>
</svg>
